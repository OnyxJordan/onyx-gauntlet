# Deploys this repo to GitHub Pages.
#
# This workflow turns Pages on by itself, via configure-pages' enablement flag,
# so nobody has to visit Settings. It runs on every push to main, which means a
# commit from the publish workflow goes live without a second step.
#
# Source of truth is the repo root: index.html is the page, and the other files
# ride along harmlessly since they are public anyway.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-deployed page is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fail early if the page is missing or still a placeholder
        run: |
          test -s index.html || { echo "::error::index.html is missing or empty"; exit 1; }
          if grep -q "__DATA__\|__UPDATED__" index.html; then
            echo "::error::index.html still contains template placeholders"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
