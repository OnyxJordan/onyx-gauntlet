# Onyx Odds leaderboards.
# Fetches the standings, renders every board in boards/ plus the homepage, and
# commits them. That is the whole publish: the commit IS the deploy.
#
# One run of build.py publishes every board and costs ONE Retool workflow run,
# because the webhook returns every parked snapshot in a single answer and the
# build picks each board's out of it. Adding a board must not change that.
#
# This workflow does not deploy to Pages and must not start again. Pages on
# this repository is served from the main branch, so GitHub's own "pages build
# and deployment" runs on every push, including the ones this job makes with
# GITHUB_TOKEN. Adding actions/deploy-pages here put a second deployer against
# that one and the loser died on "No artifacts named github-pages", which is
# what reddened three runs on 2026-11-20. One deployer, and it is GitHub's.
#
# This job no longer runs the slow standings query itself. Retool does that on
# its own hourly schedule and parks the answer; this reads the parked copy in
# about 200ms, so running it often costs nothing. See README section 5.
name: publish

on:
  # A push to main: rebuild the page against the parked snapshot so a code or
  # round.json change is reflected straight away rather than at the next
  # refresh. A commit this workflow makes cannot retrigger it, because pushes
  # authenticated with GITHUB_TOKEN do not fire `on: push`.
  push:
    branches: [main]

  # Four times a day, and only as a backstop.
  #
  # EVERY RUN OF THIS WORKFLOW COSTS A RETOOL WORKFLOW RUN, because it reads
  # the standings through the gauntlet-standings webhook. This was "*/15",
  # which is 96 a day, and together with the hourly refresh and the publishes
  # Retool itself dispatches it worked out at about 144 Retool runs a day, or
  # roughly 4,300 a month against an allowance of 5,000 shared with every
  # other workflow in the org. Retool hit 100% on 2026-11-21 and the Gauntlet
  # stopped refreshing. The frequency was mine and it was far too high.
  #
  # Retool already dispatches a publish the moment it parks a new snapshot, so
  # new standings still reach the page within seconds of existing. This is only
  # here to catch the case where that dispatch fails, and publishing an
  # unchanged page commits nothing anyway.
  schedule:
    - cron: "27 */6 * * *"

  workflow_dispatch:
    inputs:
      final:
        description: 'Say "Final Standings as of" instead of "Updated as of"'
        type: boolean
        default: false
      dry_run:
        description: "Render and show the diff, but do not commit or deploy"
        type: boolean
        default: false

# Shared with pages.yml so a hand edit and a scheduled publish cannot deploy
# over each other.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check a standings source is configured
        env:
          HOOK: ${{ secrets.RETOOL_WEBHOOK_URL }}
          DBURL: ${{ secrets.RETOOL_DB_URL }}
        run: |
          if [ -z "$DBURL" ] && [ -z "$HOOK" ]; then
            echo "::error::Neither RETOOL_DB_URL nor RETOOL_WEBHOOK_URL is set. See SETUP.md stage 6."
            exit 1
          fi
          [ -n "$DBURL" ] && echo "reading from retool_db (costs no Retool workflow run)"
          [ -n "$HOOK" ]  && echo "webhook available as a fallback"
          true

      # Only for the database path, which needs RETOOL_DB_URL. Retool Database
      # does not offer an external connection string on every plan, and it does
      # not on this account, so this usually skips and the build reads the
      # standings through the webhook instead.
      # The check is in the shell on purpose. `secrets` is not one of the
      # contexts GitHub allows in a step-level `if`, and using it there does
      # not warn: it makes the whole file invalid, so no job runs at all and
      # the workflow silently stops publishing. That happened on 2026-11-21
      # and froze the board for nine hours.
      - name: Install the Postgres driver, if there is a database to reach
        env:
          DBURL: ${{ secrets.RETOOL_DB_URL }}
        run: |
          if [ -n "$DBURL" ]; then
            pip install --quiet psycopg2-binary
          else
            echo "no RETOOL_DB_URL; the build will read the standings over the webhook"
          fi

      - name: Build the page
        env:
          RETOOL_DB_URL: ${{ secrets.RETOOL_DB_URL }}
          RETOOL_WEBHOOK_URL: ${{ secrets.RETOOL_WEBHOOK_URL }}
          RETOOL_WORKFLOW_KEY: ${{ secrets.RETOOL_WORKFLOW_KEY }}
        run: |
          args="--source auto"
          [ "${{ inputs.final }}" = "true" ] && args="$args --final"
          python3 build.py $args

      # Two publishes can be in flight at once: Retool dispatches one the moment
      # it parks a snapshot, and the cron backstop fires on its own schedule.
      # When they overlap the second push is rejected with "fetch first" and
      # that run dies, which happened on 2026-11-14.
      #
      # Rebasing is not the answer here. Both runs rewrite the same two files
      # in full, so a rebase conflicts every time. Instead take whatever landed
      # while we were working, build again on top of it, and push that. The
      # rebuild is cheap: it reads the parked snapshot over the webhook in
      # about 200ms and never touches the production database.
      - name: Refuse to publish a broken page
        run: |
          # This runs before the commit, not after, because committing IS
          # publishing: GitHub's own branch builder deploys every push to main.
          # A broken page that reaches the commit is already live.
          #
          # Every page the build writes is checked, not just the homepage. A
          # board that could not be built is left exactly as it was and is
          # therefore still valid, so this looks at what is on disk rather than
          # at what this run happened to rewrite.
          fail=0
          for f in index.html */index.html; do
            [ -e "$f" ] || continue
            if [ ! -s "$f" ]; then
              echo "::error::$f is empty"; fail=1; continue
            fi
            # An unfilled placeholder means a template and a board file have
            # drifted apart, and the page says __POOL__ where a number belongs.
            if grep -qE '__[A-Z0-9_]+__' "$f"; then
              echo "::error::$f still contains template placeholders:"
              grep -oE '__[A-Z0-9_]+__' "$f" | sort -u
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

      - name: Commit if the standings changed
        env:
          FINAL: ${{ inputs.final }}
          DRY: ${{ inputs.dry_run }}
          RETOOL_DB_URL: ${{ secrets.RETOOL_DB_URL }}
          RETOOL_WEBHOOK_URL: ${{ secrets.RETOOL_WEBHOOK_URL }}
          RETOOL_WORKFLOW_KEY: ${{ secrets.RETOOL_WORKFLOW_KEY }}
        run: |
          git config user.name "onyx-gauntlet-bot"
          git config user.email "actions@users.noreply.github.com"

          build() {
            args="--source auto"
            [ "$FINAL" = "true" ] && args="$args --final"
            python3 build.py $args
          }

          for attempt in 1 2 3; do
            # The state files must be committed too, not just the pages: they
            # carry the ranks the next run diffs against. Without them every run
            # starts blank and the Move column reads New forever.
            git add -A index.html */index.html state
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            if [ "$DRY" = "true" ]; then
              echo "dry run, not committing. Diff stat:"
              git diff --cached --stat
              exit 0
            fi
            git commit -q -m "Standings $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
            if git push; then
              exit 0
            fi

            echo "push rejected; another publish got there first. Rebuilding on top of it."
            git fetch origin main
            git reset --hard FETCH_HEAD
            build
          done

          echo "::error::could not push after 3 attempts"
          exit 1

      - name: Keep the rendered page as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages
          path: |
            index.html
            */index.html
          if-no-files-found: ignore
          retention-days: 14

