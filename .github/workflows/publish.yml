# Onyx Odds, Mini Games Gauntlet leaderboard.
# Fetches standings, renders index.html, commits it AND deploys it to Pages.
#
# The deploy lives here rather than in pages.yml on purpose. A push made with
# GITHUB_TOKEN does not trigger `on: push` workflows, which is GitHub's loop
# prevention, so a commit from this job would never wake pages.yml and the site
# would sit stale behind the repo. Doing both in one job removes the chaining.
#
# This job no longer runs the slow standings query itself. Retool does that on
# its own hourly schedule and parks the answer; this reads the parked copy in
# about 200ms, so running it often costs nothing. See README section 5.
name: publish

on:
  # Four times an hour, on deliberately unpopular minutes.
  #
  # GitHub's scheduler is badly unreliable on this repo and asking more often
  # did not fix it. Measured 2026-11-14: with "*/15" set, which asks for 96
  # runs a day, GitHub fired the schedule 3 times in 19 hours, roughly every
  # 6.5 hours. Before that, hourly fired twice in 24 hours. Runs are dropped,
  # not merely delayed, and there is no setting that changes this.
  #
  # The minutes below avoid :00, :15, :30 and :45. GitHub's own docs say runs
  # scheduled on the hour are the most likely to be dropped because that is
  # when every repo on the platform asks at once, so odd minutes are the one
  # lever available here. They are also placed just after the Retool refresh,
  # which lands between :07 and :14, so a publish follows new data closely.
  #
  # Treat this as a mitigation, not a fix. The reliable path is Retool calling
  # this workflow by workflow_dispatch the moment it parks a new snapshot,
  # since that schedule does fire on time. See README section 5.
  #
  # This is cheap. It no longer touches the production database at all: the
  # gauntlet-refresh workflow in Retool runs the slow query on its own schedule
  # and parks the result in retool_db, and the webhook this calls just reads
  # that back in about 200ms. A run where nothing changed commits nothing.
  # Public repos get unlimited Actions minutes.
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      final:
        description: 'Say "Final Standings as of" instead of "Updated as of"'
        type: boolean
        default: false
      dry_run:
        description: "Render and show the diff, but do not commit or deploy"
        type: boolean
        default: false

# Shared with pages.yml so a hand edit and a scheduled publish cannot deploy
# over each other.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the webhook secret is set
        env:
          HOOK: ${{ secrets.RETOOL_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RETOOL_WEBHOOK_URL is not set. See SETUP.md stage 3."
            exit 1
          fi

      - name: Build the page
        env:
          RETOOL_WEBHOOK_URL: ${{ secrets.RETOOL_WEBHOOK_URL }}
          RETOOL_WORKFLOW_KEY: ${{ secrets.RETOOL_WORKFLOW_KEY }}
        run: |
          args="--source retool"
          [ "${{ inputs.final }}" = "true" ] && args="$args --final"
          python3 build.py $args

      - name: Commit if the standings changed
        run: |
          git config user.name "onyx-gauntlet-bot"
          git config user.email "actions@users.noreply.github.com"
          # previous.json must be committed too, not just the page: it carries
          # the ranks the next run diffs against. Without it every run starts
          # blank and the Move column reads New forever.
          git add index.html previous.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run, not committing. Diff stat:"
            git diff --cached --stat
            exit 0
          fi
          git commit -m "Standings $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push

      - name: Keep the rendered page as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: index.html
          if-no-files-found: ignore
          retention-days: 14

      # Deploy steps below are skipped on a dry run, so a dry run can never
      # change what the public sees.
      - name: Turn Pages on if it is not already
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Refuse to deploy a broken page
        if: ${{ inputs.dry_run != true }}
        run: |
          test -s index.html || { echo "::error::index.html is missing or empty"; exit 1; }
          if grep -q "__DATA__\|__UPDATED__" index.html; then
            echo "::error::index.html still contains template placeholders"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != true }}
        with:
          path: .

      - id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
