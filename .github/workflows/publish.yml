# Onyx Odds, Mini Games Gauntlet leaderboard.
# Fetches standings, renders index.html, commits it AND deploys it to Pages.
#
# The deploy lives here rather than in pages.yml on purpose. A push made with
# GITHUB_TOKEN does not trigger `on: push` workflows, which is GitHub's loop
# prevention, so a commit from this job would never wake pages.yml and the site
# would sit stale behind the repo. Doing both in one job removes the chaining.
#
# Runs every 3 hours rather than hourly, because the standings query currently
# costs ~63 seconds scanning all 38 GB of "ThirdPartyBet" on the production
# primary. Every 3 hours is 8 runs a day, about 8 minutes of scanning; hourly
# would be 25. Once that table has an index leading with createdAt the query
# becomes near-instant and this can safely go to "5 * * * *" or faster.
# See README section 5.
name: publish

on:
  # Off until "ThirdPartyBet" has an index on createdAt. Retool caps a
  # synchronous webhook response at 120 seconds and the standings query now
  # exceeds that, so every scheduled run fails and mails about it. Turn this
  # back on the day the index lands.
  # schedule:
  #   - cron: "5 */3 * * *"
  workflow_dispatch:
    inputs:
      final:
        description: 'Say "Final Standings as of" instead of "Updated as of"'
        type: boolean
        default: false
      dry_run:
        description: "Render and show the diff, but do not commit or deploy"
        type: boolean
        default: false

# Shared with pages.yml so a hand edit and a scheduled publish cannot deploy
# over each other.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the webhook secret is set
        env:
          HOOK: ${{ secrets.RETOOL_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RETOOL_WEBHOOK_URL is not set. See SETUP.md stage 3."
            exit 1
          fi

      - name: Build the page
        env:
          RETOOL_WEBHOOK_URL: ${{ secrets.RETOOL_WEBHOOK_URL }}
          RETOOL_WORKFLOW_KEY: ${{ secrets.RETOOL_WORKFLOW_KEY }}
        run: |
          args="--source retool"
          [ "${{ inputs.final }}" = "true" ] && args="$args --final"
          python3 build.py $args

      - name: Commit if the standings changed
        run: |
          git config user.name "onyx-gauntlet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run, not committing. Diff stat:"
            git diff --cached --stat
            exit 0
          fi
          git commit -m "Standings $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push

      - name: Keep the rendered page as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-html
          path: index.html
          if-no-files-found: ignore
          retention-days: 14

      # Deploy steps below are skipped on a dry run, so a dry run can never
      # change what the public sees.
      - name: Turn Pages on if it is not already
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Refuse to deploy a broken page
        if: ${{ inputs.dry_run != true }}
        run: |
          test -s index.html || { echo "::error::index.html is missing or empty"; exit 1; }
          if grep -q "__DATA__\|__UPDATED__" index.html; then
            echo "::error::index.html still contains template placeholders"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.dry_run != true }}
        with:
          path: .

      - id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
