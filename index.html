<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0c">
<title>Onyx Odds — Mini Games Gauntlet</title>
<meta name="description" content="Live standings for the Onyx Mini Games Gauntlet.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400;500;700&family=Doto:wght@800;900&display=swap');

/* Onyx design system tokens, matching onyx.css on the Onyx Sports Data site:
   black onyx surfaces, purple 400 accents, extended uppercase display type,
   mono labels, bracket buttons, dot-ended rules. No yellow.
   pos/neg/mut follow the convention set in that site's picks.html. */
:root{
  --ox-black:#0c0c0c; --ox-ink:#08080a; --ox-700:#211b25; --ox-600:#373739;
  --ox-400:#9b9b9b; --ox-200:#d4d4d4; --ox-white:#fcfcfc; --ox-body:#afa5bd;
  --ox-stroke:#2f2f2f;
  --ox-purple:#b038f9; --ox-purple-d:#8d16b8; --ox-lilac:#d795ff;
  --ox-blue:#635bff; --ox-green:#61e970; --ox-mint:#a5feaf;
  --ox-neg:#ff7a90; --ox-mut:#9a93a6;
  --ox-display:'Archivo',system-ui,sans-serif;
  --ox-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ox-raster:'Doto','Geist Mono',monospace;
  --ox-sat:env(safe-area-inset-top,0px); --ox-sab:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ox-black);color:var(--ox-white);font-family:var(--ox-display);
  font-stretch:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}

/* header. Carries the safe-area inset itself now that nothing sits above it. */
.head{position:sticky;top:0;z-index:50;background:rgba(12,12,12,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:var(--ox-sat)}
.head-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{height:19px;width:auto;color:var(--ox-white);flex-shrink:0}
.brand span{font:500 10px var(--ox-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ox-lilac);white-space:nowrap}
.acts{display:flex;align-items:center;gap:16px}
.markc{display:block;width:20px;color:var(--ox-purple);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.markc:hover{transform:rotateY(180deg)}
.markc svg{display:block;width:100%;height:auto}

/* bracket button: [ LABEL ] */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:44px;padding:0 26px;font:500 12px var(--ox-mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ox-white);background:none;border:0;cursor:pointer;transition:color .2s,background .2s;
  -webkit-tap-highlight-color:transparent}
.btn::before,.btn::after{content:"";position:absolute;top:0;bottom:0;width:9px;border:1.5px solid currentColor;
  transition:transform .25s cubic-bezier(.2,.9,.25,1),border-color .2s}
.btn::before{left:0;border-right:0}.btn::after{right:0;border-left:0}
.btn:hover:not(:disabled)::before{transform:translateX(-5px)}
.btn:hover:not(:disabled)::after{transform:translateX(5px)}
.btn:hover:not(:disabled){color:var(--ox-lilac)}
.btn:focus-visible{outline:2px solid var(--ox-purple);outline-offset:6px}
.btn.sm{min-height:36px;padding:0 18px;font-size:11px}
.btn:disabled{opacity:.3;cursor:default;color:var(--ox-400)}

/* eyebrow with diamond markers */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 12px var(--ox-mono);
  letter-spacing:.14em;text-transform:uppercase;color:var(--ox-purple)}
.eyebrow::before,.eyebrow::after{content:"";width:7px;height:6px;background:currentColor;
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}

/* marquee */
.marq{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--ox-stroke);padding:11px 0;
  -webkit-mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq>div{display:inline-flex;animation:marq 38s linear infinite}
.marq span{display:inline-flex;align-items:center;gap:26px;padding-right:26px;
  font:500 clamp(12px,1.4vw,17px) var(--ox-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ox-white)}
.marq i{width:7px;height:6px;background:var(--ox-purple);flex-shrink:0;
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
@keyframes marq{to{transform:translateX(-50%)}}

/* hero */
.hero{position:relative;overflow:hidden;padding:clamp(34px,7vw,76px) 0 0}
.hero-art{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;
  text-align:center;padding-bottom:clamp(26px,4vw,44px)}
.hero h1{margin:0;font:800 clamp(52px,13vw,168px)/.86 var(--ox-display);font-stretch:125%;
  text-transform:uppercase;letter-spacing:-.012em}
.hero h1 em{font-style:normal;color:var(--ox-purple)}
.hero-sub{max-width:620px;font:500 clamp(11px,1.15vw,13px)/1.7 var(--ox-mono);letter-spacing:.05em;
  text-transform:uppercase;color:var(--ox-body)}

/* stat strip */
.stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--ox-stroke);border-bottom:1px solid var(--ox-stroke)}
.stat{padding:18px clamp(8px,2vw,22px);text-align:center;border-left:1px solid var(--ox-stroke)}
.stat:first-child{border-left:0}
.stat b{display:block;font:900 clamp(22px,3.4vw,38px)/1 var(--ox-raster);color:var(--ox-white);margin-bottom:7px}
.stat b.live{color:var(--ox-green)}
.stat i{font:500 10px var(--ox-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ox-400);font-style:normal}

/* controls */
.main{padding:clamp(26px,4vw,44px) 0 clamp(50px,8vw,90px)}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.srch{flex:1;min-width:210px;position:relative}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45;pointer-events:none}
input[type=text],select{background:var(--ox-ink);border:1px solid var(--ox-stroke);color:var(--ox-white);
  font:500 12px var(--ox-mono);letter-spacing:.05em;text-transform:uppercase;padding:13px 14px;
  outline:none;transition:border-color .2s;border-radius:0;-webkit-appearance:none;appearance:none}
input[type=text]{width:100%;padding-left:42px}
input[type=text]::placeholder{color:var(--ox-600);text-transform:uppercase}
input[type=text]:focus,select:focus{border-color:var(--ox-purple)}
select{cursor:pointer;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ox-400) 50%),linear-gradient(135deg,var(--ox-400) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.showing{font:500 11px var(--ox-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ox-400);margin-bottom:12px}

/* board */
.board{border:1px solid var(--ox-stroke);background:var(--ox-ink)}
table{width:100%;border-collapse:collapse}
thead th{padding:13px 16px;text-align:left;font:500 10px var(--ox-mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ox-400);border-bottom:1px solid var(--ox-stroke);
  cursor:pointer;white-space:nowrap;user-select:none;transition:color .15s}
thead th:hover{color:var(--ox-white)}
thead th.on{color:var(--ox-purple)}
thead th.prize,td.prize{text-align:right}
tbody tr{border-bottom:1px solid rgba(47,47,47,.55);transition:background .12s}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:rgba(176,56,249,.055)}
tbody tr.t1{background:rgba(176,56,249,.10)}
tbody tr.t2{background:rgba(176,56,249,.065)}
tbody tr.t3{background:rgba(176,56,249,.04)}
td{padding:13px 16px;vertical-align:middle}
.rk{font:900 20px/1 var(--ox-raster);color:var(--ox-200);min-width:30px;display:inline-block}
tr.t1 .rk,tr.t2 .rk,tr.t3 .rk{color:var(--ox-purple);font-size:24px}
.who{font:500 13px var(--ox-mono);letter-spacing:.06em;color:var(--ox-white)}
.pz{display:inline-block;border:1px solid var(--ox-purple);color:var(--ox-lilac);
  font:500 11px var(--ox-mono);letter-spacing:.06em;padding:4px 11px;border-radius:999px}
tr.t1 .pz{background:var(--ox-purple);color:#fff}
.pz0{color:var(--ox-600);font:500 12px var(--ox-mono)}

/* movement since the previous update */
.mv{white-space:nowrap;font:500 12px var(--ox-mono);letter-spacing:.04em;min-width:58px;display:inline-block}
.mv.up{color:var(--ox-green)}
.mv.dn{color:var(--ox-neg)}
.mv.sm{color:var(--ox-mut)}
.mv.nw{color:var(--ox-purple)}
.mv s{text-decoration:none;font-size:10px;margin-right:3px}

.empty{padding:56px 16px;text-align:center}
.empty b{display:block;font:800 18px var(--ox-display);font-stretch:125%;text-transform:uppercase;color:var(--ox-200);margin-bottom:8px}
.empty i{font:500 12px var(--ox-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ox-400);font-style:normal}

.pages{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:24px}
.pages span{min-width:120px;text-align:center;font:500 11px var(--ox-mono);letter-spacing:.08em;
  text-transform:uppercase;color:var(--ox-400)}

footer{border-top:1px solid var(--ox-stroke);padding:26px 0 calc(26px + var(--ox-sab));text-align:center}
footer p{font:500 10px/1.9 var(--ox-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ox-600)}

@media (max-width:760px){
  .board{border-left:0;border-right:0}
  thead th,td{padding:11px 10px}
  .brand span{display:none}
  .acts .btn{display:none}
}
@media (max-width:460px){
  .mv{min-width:44px;font-size:11px}
  .mv s{margin-right:1px}
  .who{font-size:12px;letter-spacing:.03em}
  .rk{font-size:17px;min-width:22px}
  .stat b{font-size:20px}
}
@media (prefers-reduced-motion:reduce){.marq>div{animation:none}}
</style>
</head>

/* marquee */
(function(){
  var el=document.getElementById('mq');
  if(!el)return;
  var words=['Mini Games Gauntlet','Live Standings','10,000 Bonus Onyx Cash','Top 20 Win','Ranked By Stake'];
  var run='';
  for(var k=0;k<2;k++){
    run+='<span>';
    for(var i=0;i<words.length;i++)run+=words[i]+'<i></i>';
    run+='</span>';
  }
  el.innerHTML=run;
})();

var fil=ALL.slice(),sk='r',sd=1,pg=1,ps=25;
/* Search by real username, without the page holding any real username.
   Rows carry a digest of the handle; we hash what is typed the same way and
   compare. The hash is async, so it is computed off to the side and kept in
   QK, and the row filter below reads whatever QK currently holds. Typing a
   whole handle therefore finds the row it is masked as, which plain text
   matching against the mask never could. */
var QK='',SALT='onyx-gauntlet:',SEQ=0;
function digest(s){
  if(!(window.crypto&&crypto.subtle&&crypto.subtle.digest))return Promise.resolve('');
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+s))
    .then(function(b){
      var out='',v=new Uint8Array(b);
      for(var i=0;i<6;i++)out+=('0'+v[i].toString(16)).slice(-2);
      return out;
    })['catch'](function(){return ''});
}
document.getElementById('q').addEventListener('input',function(){
  pg=1;
  var q=this.value.trim(),n=++SEQ;
  render();
  if(!q){QK='';return}
  digest(q.toLowerCase()).then(function(h){
    /* A slower hash from an earlier keystroke must not overwrite a newer one. */
    if(n!==SEQ)return;
    if(h!==QK){QK=h;render()}
  });
});
document.getElementById('ps').addEventListener('change',function(e){ps=+e.target.value;pg=1;render()});
function sb(k){sd=sk===k?-sd:(k==='r'?1:-1);sk=k;pg=1;render()}
function go(d){var t=Math.max(1,Math.ceil(fil.length/ps));pg=Math.max(1,Math.min(t,pg+d));render()}

/* movement cell: spots gained or lost since the previous update */
function move(r){
  if(r.d===null||r.d===undefined)return '<span class="mv nw">New</span>';
  if(r.d>0)return '<span class="mv up"><s>&#9650;</s>'+r.d+'</span>';
  if(r.d<0)return '<span class="mv dn"><s>&#9660;</s>'+(-r.d)+'</span>';
  return '<span class="mv sm"><s>&ndash;</s></span>';
}

function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  /* An exact username match wins outright: show that one row rather than
     burying it among handles that happen to share letters. */
  var hit=QK?ALL.filter(function(r){return r.k===QK}):[];
  fil=hit.length?hit
     :q?ALL.filter(function(r){return r.u.toLowerCase().indexOf(q)>=0})
     :ALL.slice();
  fil.sort(function(a,b){
    if(sk==='u')return a.u.localeCompare(b.u)*sd;
    if(sk==='d'){
      /* players with no previous rank sort last either way */
      var av=(a.d===null||a.d===undefined)?null:a.d,bv=(b.d===null||b.d===undefined)?null:b.d;
      if(av===null&&bv===null)return a.r-b.r;
      if(av===null)return 1;
      if(bv===null)return -1;
      return (av-bv)*sd||a.r-b.r;
    }
    return (a[sk]-b[sk])*sd;
  });
  var tot=Math.max(1,Math.ceil(fil.length/ps)),st=(pg-1)*ps,sl=fil.slice(st,st+ps);
  document.getElementById('show').textContent=fil.length
    ? 'Showing '+(st+1)+'–'+Math.min(st+ps,fil.length)+' of '+fil.length.toLocaleString()+' players'
    : '0 players';
  ['r','d','u','p'].forEach(function(k){
    var el=document.getElementById('h-'+k),lb={r:'Rank',d:'Move',u:'Player',p:'Prize'};
    el.className=(k==='p'?'prize':'')+(sk===k?' on':'');
    el.textContent=lb[k]+(sk===k?(sd===1?' ↑':' ↓'):'');
  });
  if(!fil.length){
    document.getElementById('tb').innerHTML='<tr><td colspan="4"><div class="empty"><b>No matches</b><i>No players found for that search</i></div></td></tr>';
  }else{
    document.getElementById('tb').innerHTML=sl.map(function(r){
      var cls=r.r<=3?'t'+r.r:'';
      var pz=r.p>0?'<span class="pz">'+r.p.toLocaleString()+'</span>':'<span class="pz0">&ndash;</span>';
      return '<tr class="'+cls+'">'
        +'<td><span class="rk">'+r.r+'</span></td>'
        +'<td>'+move(r)+'</td>'
        +'<td><span class="who">'+r.u+'</span></td>'
        +'<td class="prize">'+pz+'</td></tr>';
    }).join('');
  }
  document.getElementById('pi').textContent='Page '+pg+' of '+tot;
  var b=document.querySelectorAll('.pages button');
  b[0].disabled=pg<=1;b[1].disabled=pg>=tot;
}

(function(){
  var paid=0,pool=0;
  for(var i=0;i<ALL.length;i++){if(ALL[i].p>0){paid++;pool+=ALL[i].p}}
  document.getElementById('sPlayers').textContent=ALL.length.toLocaleString();
  document.getElementById('sPool').textContent=pool.toLocaleString();
  document.getElementById('sPaid').textContent=paid.toLocaleString();
})();

render();
